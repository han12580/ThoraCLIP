[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "thoraclip"
version = "0.1.0"
description = "Video-language representations for lung and pleural surgery (paper code)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
include = ["thoraclip*"]
